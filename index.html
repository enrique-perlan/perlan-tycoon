<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Perlan Tycoon</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block;outline:none}
</style></head><body><canvas id="c" width="640" height="448" tabindex="0"></canvas><script>
'use strict';
// ===== CORE: screen, helpers, pixel font =====
const SW = 320, SH = 224, CW = 640, CH = 448, W = 30, H = 28;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fit() {
  let s = Math.min(innerWidth / CW, innerHeight / CH);       // as big as the screen allows
  cv.style.width = Math.floor(CW * s) + 'px';
  cv.style.height = Math.floor(CH * s) + 'px';
}
addEventListener('resize', fit); document.addEventListener('fullscreenchange', fit); fit();
// full screen: the button at the top right, or the F key
function toggleFull() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement) { d.exitFullscreen().catch(() => { }); return; }
  const no = () => msg('PRESS F11 FOR FULL SCREEN (MAC: CTRL+CMD+F)', 1);
  try { const p = el.requestFullscreen && el.requestFullscreen(); if (p && p.catch) p.catch(no); else if (!p) no(); } catch (e) { no(); }
}

const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rr = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function R(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

// Mega Drive style palette: only even hex digits (0 2 4 6 8 a c e)
const K = {
  black: '#000', ink: '#002', navy: '#024', navy2: '#046', blue: '#248', blue2: '#48c', sky: '#6ae', ice: '#8ce', ice2: '#cef',
  white: '#eee', grey1: '#ccc', grey2: '#aaa', grey3: '#888', grey4: '#666', grey5: '#444', grey6: '#222',
  red: '#e22', red2: '#a22', red3: '#622', orange: '#e82', yellow: '#ec2', gold: '#ea0', gold2: '#a60',
  green: '#4a4', green2: '#282', lime: '#8e6', teal: '#4ca', cyan: '#4ce', purple: '#a4e', purple2: '#426', pink: '#e8c',
  skin1: '#eca', skin2: '#c86', skin3: '#a64', skin4: '#642', wood: '#a64', wood2: '#842', wood3: '#c84'
};

// ----- 5x7 pixel font -----
const FD = {
  'A': '01110 10001 10001 11111 10001 10001 10001', 'B': '11110 10001 10001 11110 10001 10001 11110',
  'C': '01110 10001 10000 10000 10000 10001 01110', 'D': '11110 10001 10001 10001 10001 10001 11110',
  'E': '11111 10000 10000 11110 10000 10000 11111', 'F': '11111 10000 10000 11110 10000 10000 10000',
  'G': '01110 10001 10000 10111 10001 10001 01111', 'H': '10001 10001 10001 11111 10001 10001 10001',
  'I': '01110 00100 00100 00100 00100 00100 01110', 'J': '00111 00010 00010 00010 00010 10010 01100',
  'K': '10001 10010 10100 11000 10100 10010 10001', 'L': '10000 10000 10000 10000 10000 10000 11111',
  'M': '10001 11011 10101 10101 10001 10001 10001', 'N': '10001 11001 10101 10011 10001 10001 10001',
  'O': '01110 10001 10001 10001 10001 10001 01110', 'P': '11110 10001 10001 11110 10000 10000 10000',
  'Q': '01110 10001 10001 10001 10101 10010 01101', 'R': '11110 10001 10001 11110 10100 10010 10001',
  'S': '01111 10000 10000 01110 00001 00001 11110', 'T': '11111 00100 00100 00100 00100 00100 00100',
  'U': '10001 10001 10001 10001 10001 10001 01110', 'V': '10001 10001 10001 10001 10001 01010 00100',
  'W': '10001 10001 10001 10101 10101 10101 01010', 'X': '10001 10001 01010 00100 01010 10001 10001',
  'Y': '10001 10001 01010 00100 00100 00100 00100', 'Z': '11111 00001 00010 00100 01000 10000 11111',
  '0': '01110 10001 10011 10101 11001 10001 01110', '1': '00100 01100 00100 00100 00100 00100 01110',
  '2': '01110 10001 00001 00010 00100 01000 11111', '3': '11110 00001 00001 01110 00001 00001 11110',
  '4': '00010 00110 01010 10010 11111 00010 00010', '5': '11111 10000 11110 00001 00001 10001 01110',
  '6': '00110 01000 10000 11110 10001 10001 01110', '7': '11111 00001 00010 00100 01000 01000 01000',
  '8': '01110 10001 10001 01110 10001 10001 01110', '9': '01110 10001 10001 01111 00001 00010 01100',
  '.': '00000 00000 00000 00000 00000 01100 01100', ',': '00000 00000 00000 00000 01100 00100 01000',
  ':': '00000 01100 01100 00000 01100 01100 00000', '!': '00100 00100 00100 00100 00100 00000 00100',
  '?': '01110 10001 00001 00010 00100 00000 00100', '-': '00000 00000 00000 11111 00000 00000 00000',
  '+': '00000 00100 00100 11111 00100 00100 00000', '/': '00001 00001 00010 00100 01000 10000 10000',
  '%': '11001 11010 00010 00100 01000 01011 10011', "'": '00100 00100 01000 00000 00000 00000 00000',
  '(': '00010 00100 01000 01000 01000 00100 00010', ')': '01000 00100 00010 00010 00010 00100 01000',
  '=': '00000 00000 11111 00000 11111 00000 00000', '*': '00000 10101 01110 11111 01110 10101 00000',
  '<': '00010 00100 01000 10000 01000 00100 00010', '>': '01000 00100 00010 00001 00010 00100 01000',
  '_': '00000 00000 00000 00000 00000 00000 11111', '#': '01010 01010 11111 01010 11111 01010 01010',
  ' ': '00000 00000 00000 00000 00000 00000 00000'
};
const GL = {};
for (const ch in FD) GL[ch] = FD[ch].split(' ').map(r => parseInt(r, 2));
const gcache = {};
function glyph(ch, col, sc) {
  const k = ch + col + sc; let g = gcache[k];
  if (!g) {
    const rows = GL[ch] || GL['?'];
    const [c, x] = mk(5 * sc, 7 * sc); x.fillStyle = col;
    for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if ((rows[r] >> (4 - b)) & 1) x.fillRect(b * sc, r * sc, sc, sc);
    gcache[k] = g = c;
  }
  return g;
}
function tw(s, sc = 1) { s = String(s); return s.length ? s.length * 6 * sc - sc : 0; }
// draw text, optional shadow colour. returns width.
function T(s, x, y, col = K.white, sc = 1, sh = null) {
  s = String(s).toUpperCase(); x = x | 0; y = y | 0;
  if (sh) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') ctx.drawImage(glyph(s[i], sh, sc), x + i * 6 * sc + sc, y + sc); }
  for (let i = 0; i < s.length; i++) if (s[i] !== ' ') ctx.drawImage(glyph(s[i], col, sc), x + i * 6 * sc, y);
  return tw(s, sc);
}
function Tc(s, cx, y, col, sc = 1, sh = null) { T(s, Math.round(cx - tw(s, sc) / 2), y, col, sc, sh); }
function Tr(s, rx, y, col, sc = 1, sh = null) { T(s, rx - tw(s, sc), y, col, sc, sh); }
const WARN = new Set();
function fitWarn(label, w, what) { if (tw(label) > w) { const k = what + label; if (!WARN.has(k)) { WARN.add(k); console.warn('OVERFLOW', what, label, tw(label), '>', w); } } }

// small pattern sprite from rows of chars + legend
function pat(rows, legend) {
  const h = rows.length, w = rows[0].length; const [c, g] = mk(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const ch = rows[y][x]; if (ch !== '.' && legend[ch]) { g.fillStyle = legend[ch]; g.fillRect(x, y, 1, 1); } }
  return c;
}
// ===== ART: every sprite is drawn from code at start-up (2x detail) =====
const OX = 416, OY = -35;                     // screen position of tile (0,0) top corner
const hwRow = r => r < 8 ? 2 * r + 2 : 2 * (15 - r) + 2;   // half width of a 32x16 diamond row
const ybot = x => 8 + (x >> 1);                            // bottom row of the diamond at column x (0..15)

function diamond(g, col, yoff) { g.fillStyle = col; for (let r = 0; r < 16; r++) { const hw = hwRow(r); g.fillRect(16 - hw, r + yoff, hw * 2, 1); } }
function ell(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.01)))); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); }
}
// paint a rectangle onto a slanted side face of a block. side 'L' uses x 0..15, 'R' uses x 16..31
function FR(g, side, x0, x1, dy, h, col) {
  g.fillStyle = col;
  for (let x = x0; x <= x1; x++) { const y = (side === 'L' ? ybot(x) : ybot(31 - x)) + 1 + dy; g.fillRect(x, y, 1, h); }
}

// ----- floor tiles -----
const ZONES = {
  l: { a: '#cce', b: '#aac', acc: '#eee' }, w: { a: '#866', b: '#755', acc: '#e82' },
  o: { a: '#48c', b: '#37b', acc: '#8ce' }, n: { a: '#426', b: '#315', acc: '#ee8' },
  N: { a: '#264', b: '#153', acc: '#8ea' }, M: { a: '#2a6', b: '#195', acc: '#8ea' },
  g: { a: '#cee', b: '#bdd', acc: '#fff' }, a: { a: '#4ce', b: '#3bd', acc: '#cef' },
  h: { a: '#aaa', b: '#999', acc: '#ccc' }, d: { a: '#ca8', b: '#b97', acc: '#eca' },
  s: { a: '#c66', b: '#b55', acc: '#e88' }, i: { a: '#ecc', b: '#dbb', acc: '#fff' },
  t: { a: '#cee', b: '#9bc', acc: '#eee' }, f: { a: '#ec8', b: '#db7', acc: '#eea' },
  v: { a: '#422', b: '#311', acc: '#a42' }, c: { a: '#9ce', b: '#8bd', acc: '#fff' }, a: { a: '#665', b: '#554', acc: '#886' },
  W: { a: '#9a9aa4', b: '#8c8c96', acc: '#bbb' }
};
const TILES = {};
function makeTile(z, v) {
  const [c, g] = mk(32, 16), Z = ZONES[z];
  const par = v & 1, base = par ? Z.b : Z.a, alt = par ? Z.a : Z.b;
  for (let r = 0; r < 16; r++) {
    const hw = hwRow(r);
    for (let x = 16 - hw; x < 16 + hw; x++) {
      let col = base;
      if (v >= 2 && (x * 3 + r * 5) % 13 === 0) col = alt;
      if (z === 'd' && (x + r * 2) % 10 === 0) col = Z.b;
      if (z === 't' && (x === 15 || x === 16 || r === 7 || r === 8)) col = Z.b;
      g.fillStyle = col; g.fillRect(x, r, 1, 1);
    }
    g.fillStyle = r < 8 ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.16)';
    g.fillRect(16 - hw, r, 1, 1); g.fillRect(15 + hw, r, 1, 1);
  }
  let seed = (z.charCodeAt(0) * 31 + v * 17) % 97 + 3;
  const nr = () => (seed = (seed * 41 + 13) % 101) / 101;
  const nacc = { n: 5, N: 4, M: 4, w: 4, g: 3, a: 3 }[z] || 0;
  for (let k = 0; k < nacc; k++) {
    const r = 2 + Math.floor(nr() * 12), hw = hwRow(r) - 2, x = 16 - hw + Math.floor(nr() * hw * 2);
    g.fillStyle = Z.acc; g.fillRect(x, r, z === 'a' ? 3 : (z === 'N' || z === 'M' || z === 'g') ? 2 : 1, 1);
  }
  return c;
}
for (const z in ZONES) { TILES[z] = []; for (let v = 0; v < 4; v++) TILES[z].push(makeTile(z, v)); }

// ----- generic shapes (32 wide; the bottom 16 rows are the floor tile) -----
function blockSprite(h, top, left, right, o) {
  o = o || {};
  const [c, g] = mk(32, 16 + h);
  for (let x = 0; x < 32; x++) {
    const xm = x < 16 ? x : 31 - x, y0 = ybot(xm) + 1;
    g.fillStyle = x < 16 ? left : right; g.fillRect(x, y0, 1, h);
    if (o.lines) { g.fillStyle = o.lineCol || 'rgba(0,0,0,0.2)'; for (let y = y0 + o.lines - 1; y < y0 + h; y += o.lines) g.fillRect(x, y, 1, 1); }
    if (o.brick) {
      g.fillStyle = 'rgba(0,0,0,0.18)';
      for (let y = y0; y < y0 + h; y++) { const row = Math.floor((y - y0) / 6); if ((y - y0) % 6 === 5 || (x + (row & 1) * 4) % 8 === 0) g.fillRect(x, y, 1, 1); }
    }
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x, y0 + h - 1, 1, 1);
  }
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(15, 16, 1, h);
  diamond(g, top, 0);
  if (o.rim) { g.fillStyle = o.rim; for (let r = 0; r < 16; r++) { const hw = hwRow(r); g.fillRect(16 - hw, r, 1, 1); g.fillRect(15 + hw, r, 1, 1); } }
  if (o.paint) o.paint(g, h);
  return c;
}
function cylSprite(h, top, sides, o) {
  o = o || {};
  const [c, g] = mk(32, 16 + h);
  for (let x = 0; x < 32; x++) {
    const u = (x + 0.5 - 16) / 16, e = Math.sqrt(Math.max(0, 1 - u * u)), y0 = Math.round(8 + 7.2 * e);
    g.fillStyle = sides[clamp(Math.floor((u + 1) / 2 * sides.length), 0, sides.length - 1)]; g.fillRect(x, y0, 1, h);
  }
  for (let y = 0; y < 16; y++) {
    const dy = (y + 0.5 - 8) / 8, hw = Math.floor(16 * Math.sqrt(Math.max(0, 1 - dy * dy)));
    g.fillStyle = top; g.fillRect(16 - hw, y, hw * 2, 1);
    if (o.rim) { g.fillStyle = o.rim; g.fillRect(16 - hw, y, 1, 1); g.fillRect(15 + hw, y, 1, 1); }
  }
  if (o.paint) o.paint(g, h);
  return c;
}
function coneSprite(h, cols, o) {
  o = o || {};
  const [c, g] = mk(32, 16 + h);
  for (let x = 0; x < 32; x++) {
    const u = (x + 0.5 - 16) / 16, e = Math.sqrt(Math.max(0, 1 - u * u));
    const yt = Math.round(2 + (h + 6) * Math.abs(u)), yb = Math.round(h + 8 + 7.2 * e);
    for (let y = yt; y <= yb; y++) {
      let col = x < 10 ? cols[0] : x < 21 ? cols[1] : cols[2];
      if ((x === 10 || x === 21) && (y & 1)) col = x < 16 ? cols[0] : cols[1];
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  if (o.paint) o.paint(g, h);
  return c;
}

// ----- walls -----
const WALLSPR = {};
function wallSprite(kind, floor) {
  const k = kind + floor; if (WALLSPR[k]) return WALLSPR[k];
  const pal = { '-1': ['#776', '#554', '#433'], 1: ['#a88', '#866', '#644'], 2: ['#8ac', '#68a', '#468'], 4: ['#aaa', '#888', '#666'], 5: ['#c98', '#a76', '#854'] }[floor];
  let s;
  if (kind === 'tall') s = blockSprite(22, pal[0], pal[1], pal[2], { rim: '#ccc', brick: true });
  else if (kind === 'low') s = blockSprite(12, pal[0], pal[1], pal[2], { rim: '#ccc', brick: true });
  else if (kind === 'ice') s = blockSprite(16, '#eef', '#8ce', '#6ac', { rim: '#fff', paint: g => {
    for (let x = 1; x < 31; x += 3) { const side = x < 16 ? 'L' : 'R', xx = x; FR(g, side, xx, xx, 0, 2 + (x * 7) % 5, '#eef'); }
    FR(g, 'L', 4, 5, 6, 8, '#cef'); FR(g, 'R', 22, 22, 5, 7, '#cef');
  } });
  else s = blockSprite(10, '#cef', 'rgba(100,200,238,0.7)', 'rgba(70,170,220,0.8)', { rim: '#eee', lines: 5, lineCol: 'rgba(255,255,255,0.3)' });
  WALLSPR[k] = s; return s;
}

// ----- objects -----
const OBJS = {};
function def(name, fn) { OBJS[name] = fn; }
const objCache = {};
function getObj(type, v) { const k = type + '|' + (v || ''); if (!objCache[k]) objCache[k] = OBJS[type](v); return objCache[k]; }

def('counter', v => blockSprite(12, v || '#4ae', '#c84', '#a62', { rim: '#eee', lines: 4, paint: g => {
  g.fillStyle = '#444'; g.fillRect(12, 3, 8, 6); g.fillStyle = '#4ce'; g.fillRect(13, 3, 6, 3); g.fillStyle = '#eee'; g.fillRect(14, 7, 4, 1);
} }));
def('info', () => blockSprite(14, '#4c8', '#48a', '#268', { rim: '#eee', paint: g => { FR(g, 'L', 6, 8, 1, 2, '#eee'); FR(g, 'L', 6, 8, 4, 8, '#eee'); FR(g, 'R', 22, 24, 2, 9, '#ec2'); } }));
def('kiosk', () => blockSprite(20, '#ccc', '#668', '#446', { rim: '#eee', paint: g => {
  FR(g, 'L', 3, 12, 3, 8, '#024'); FR(g, 'L', 4, 11, 4, 6, '#4ce'); FR(g, 'L', 4, 11, 4, 1, '#cef');
  FR(g, 'R', 19, 28, 3, 8, '#024'); FR(g, 'R', 20, 27, 4, 6, '#4ce');
} }));
def('shelf', () => blockSprite(18, '#c84', '#a62', '#842', { rim: '#eca', paint: g => {
  const cols = ['#e22', '#4ce', '#ec2', '#a4e', '#4a4', '#e8c'];
  for (const dy of [2, 8, 14]) { FR(g, 'L', 1, 14, dy + 3, 1, '#642'); FR(g, 'R', 17, 30, dy + 3, 1, '#642');
    for (let x = 2; x < 14; x += 3) { FR(g, 'L', x, x + 1, dy, 3, cols[(x + dy) % 6]); FR(g, 'R', 31 - x - 1, 31 - x, dy, 3, cols[(x + dy + 2) % 6]); } }
} }));
def('freezer', () => blockSprite(16, '#eee', '#cce', '#aac', { rim: '#fff', paint: g => {
  g.fillStyle = '#8ce'; g.fillRect(8, 5, 16, 6); g.fillStyle = '#e8c'; g.fillRect(9, 6, 4, 4); g.fillStyle = '#eca'; g.fillRect(14, 6, 4, 4); g.fillStyle = '#8e6'; g.fillRect(19, 6, 4, 4);
  FR(g, 'L', 4, 11, 4, 5, '#e8c'); FR(g, 'L', 6, 9, 5, 1, '#fff');
} }));
def('coffee', () => blockSprite(18, '#444', '#222', '#111', { rim: '#666', paint: g => { FR(g, 'L', 5, 7, 4, 2, '#e22'); FR(g, 'R', 20, 24, 9, 5, '#eee'); FR(g, 'R', 21, 23, 7, 1, '#a64'); g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(22, 2, 1, 3); g.fillRect(23, 0, 1, 2); } }));
def('locker', v => blockSprite(22, '#88c', v || '#46a', '#248', { rim: '#ccf', paint: g => {
  for (const x of [4, 8, 12]) FR(g, 'L', x, x, 0, 22, '#024'); for (const x of [19, 23, 27]) FR(g, 'R', x, x, 0, 22, '#024');
  for (const dy of [6, 16]) { FR(g, 'L', 3, 3, dy, 2, '#ec2'); FR(g, 'L', 7, 7, dy, 2, '#ec2'); FR(g, 'L', 11, 11, dy, 2, '#ec2'); }
} }));
def('wc', () => blockSprite(20, '#eee', '#ccc', '#aaa', { rim: '#fff', paint: g => {
  FR(g, 'L', 4, 11, 5, 14, '#48c'); FR(g, 'L', 7, 8, 7, 2, '#fff'); FR(g, 'L', 7, 8, 10, 5, '#fff');
  FR(g, 'R', 20, 27, 5, 14, '#e8c'); FR(g, 'R', 23, 24, 7, 2, '#fff'); FR(g, 'R', 22, 25, 10, 5, '#fff');
} }));
def('seat', () => blockSprite(6, '#c44', '#a22', '#822', { rim: '#e88', paint: g => { g.fillStyle = '#a22'; g.fillRect(6, 1, 20, 3); g.fillStyle = '#e66'; g.fillRect(6, 1, 20, 1); } }));
def('bench', () => blockSprite(6, '#c84', '#a62', '#842', { rim: '#eca', paint: g => { g.fillStyle = '#a62'; for (let r = 3; r < 14; r += 4) { const hw = hwRow(r); g.fillRect(16 - hw + 1, r, hw * 2 - 2, 1); } } }));
def('proj', () => cylSprite(12, '#444', ['#888', '#666', '#444', '#222'], { rim: '#aaa', paint: g => { g.fillStyle = '#222'; g.fillRect(12, 3, 8, 8); g.fillStyle = '#ee8'; g.fillRect(14, 5, 4, 4); g.fillStyle = '#fff'; g.fillRect(15, 5, 1, 1); } }));
def('tank', () => cylSprite(22, '#8ce', ['#8ce', '#6ae', '#48c', '#248'], { rim: '#cef', paint: g => {
  g.fillStyle = 'rgba(220,240,255,0.5)'; g.fillRect(6, 16, 2, 18); g.fillRect(9, 18, 1, 14);
  ell(g, 13, 24, 3, 1, '#e82'); g.fillStyle = '#e82'; g.fillRect(9, 23, 2, 3); g.fillStyle = '#000'; g.fillRect(15, 24, 1, 1);
  ell(g, 22, 30, 3, 1, '#ec2'); g.fillStyle = '#ec2'; g.fillRect(25, 29, 2, 3);
  g.fillStyle = '#eee'; [[11, 19], [12, 15], [11, 11], [20, 22], [21, 18]].forEach(p => g.fillRect(p[0], p[1], 1, 1));
  g.fillStyle = 'rgba(0,0,40,0.5)'; g.fillRect(0, 36, 32, 1);
} }));
def('aqua', () => cylSprite(14, '#4ce', ['#cef', '#8ce', '#4ac', '#268'], { rim: '#eee', paint: g => {
  g.fillStyle = '#eee'; g.fillRect(15, 1, 2, 7); g.fillStyle = '#cef'; [[11, 3], [20, 3], [12, 6], [19, 6], [9, 7], [22, 7]].forEach(p => g.fillRect(p[0], p[1], 1, 1));
  ell(g, 16, 8, 6, 2, '#8ce');

const MD_LV = [0, 52, 87, 116, 144, 172, 206, 255];

  const oc = [parseInt(outline[1], 16) * 17, parseInt(outline[2], 16) * 17, parseInt(outline[3], 16) * 17];
  const out = new Uint8ClampedArray(d);
  for (let y = 0; y < H0; y++) for (let x = 0; x < W0; x++) {

    if (body) { out[k] = oc[0]; out[k + 1] = oc[1]; out[k + 2] = oc[2]; out[k + 3] = 255; }
    else if (kind[n] === 1) { const on = (x + y) & 1; out[k] = 0; out[k + 1] = 0; out[k + 2] = on ? 34 : 0; out[k + 3] = on ? 255 : 0; }   // see-through shadow -> dither

// desks: the front part of a workstation cell. sprite 32x30, desk front edge sits just below the middle of the cell
const DESKS = {};
function deskSprite(style) {
  if (DESKS[style]) return DESKS[style];
  const [c, g] = mk(32, 30), P = (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const boss = style === 'gunnar', top = boss ? '#a64' : '#cb9', front = boss ? '#742' : '#a86', edge = boss ? '#c86' : '#dca';
  const x0 = boss ? 3 : 5, x1 = boss ? 28 : 26;
  P('rgba(0,0,0,0.25)', x0 + 1, 27, x1 - x0, 2);                       // shadow
  P(top, x0, 15, x1 - x0 + 1, 6); P(edge, x0, 15, x1 - x0 + 1, 1);       // desk top
  P(front, x0, 21, x1 - x0 + 1, 6); P('rgba(0,0,0,0.25)', x0, 21, x1 - x0 + 1, 1);
  P(front, x0, 27, 2, 1); P(front, x1 - 1, 27, 2, 1);
  const mon = (mx, w = 9) => { P('#222', mx, 10, w, 6); P('#444', mx, 10, w, 1); P('#555', mx + (w >> 1), 16, 1, 1); P('#888', mx + (w >> 1), 12, 1, 1); };
  if (style === 'haukur') { mon(6); mon(17); P('#4c4', 26, 18, 1, 1); }                   // IT: two screens
  else if (style === 'margret') { P('#ccc', 9, 13, 10, 5); P('#888', 9, 13, 10, 1); P('#eee', 21, 16, 3, 3); P('#642', 22, 17, 1, 1); }   // laptop and coffee
  else if (style === 'birkir') { mon(9); P('#eee', 19, 16, 6, 3); P('#ccc', 19, 17, 6, 1); P('#333', 7, 17, 3, 3); P('#8c8', 7, 17, 3, 1); }   // spreadsheet, papers, calculator
  else if (style === 'helena') { mon(14); P('#c44', 6, 16, 5, 3); P('#48c', 7, 15, 3, 1); P('#4a4', 24, 13, 2, 3); P('#284', 23, 12, 4, 2); }   // jumper sample and a little plant
  else if (style === 'alli') { mon(9); P('#222', 20, 16, 2, 3); P('#4ce', 20, 16, 2, 1); P('#eee', 23, 15, 4, 5); P('#888', 23, 16, 4, 1); }   // phone and the staff rota
  else if (style === 'eva') { mon(13); P('#e6a', 6, 14, 4, 4); P('#4ce', 7, 15, 2, 2); P('#ec2', 22, 15, 3, 4); P('#fff', 23, 16, 1, 2); }   // posters and a camera for the socials
  else if (style === 'steffi') { mon(9); P('#222', 20, 16, 2, 3); P('#8e6', 20, 16, 2, 1); P('#48c', 23, 14, 4, 5); P('#eee', 24, 15, 2, 1); P('#eee', 24, 17, 2, 1); }   // a phone and tour brochures
  else if (boss) { mon(12, 10); P('#284', 5, 12, 2, 4); P('#ec2', 4, 11, 4, 2); P('#eee', 22, 16, 4, 3); P('#a42', 23, 17, 2, 1); }   // lamp and the ratings report
  else mon(11);
  return DESKS[style] = c;
}

// the pugs: small and black, with a curly tail. 18x13, facing right. pose: run (2 frames), sit, sleep
function pugSprite(pose, f = 0) {
  const k = 'pug' + pose + f; if (personCache[k]) return personCache[k];
  const [c, g] = mk(18, 13), P = (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const B = '#111', H = '#666', E = '#eee', M = '#555', T = '#e68';   // a lighter shine so they still read against the dark outline
  ell(g, 9, 12, 6, 1, 'rgba(0,0,0,0.3)');
  if (pose === 'sleep') {
    ell(g, 8, 9, 6, 2, B); P(H, 4, 7, 7, 1); ell(g, 13, 9, 3, 2, B); P(H, 12, 7, 2, 1); P(M, 13, 10, 3, 1);   // curled up, eyes shut
    P('#555', 12, 9); P('#555', 15, 9); P(B, 2, 8, 2, 2); P(H, 2, 8, 1, 1);
  } else if (pose === 'sit') {
    ell(g, 8, 8, 3, 3, B); P(H, 6, 5, 2, 3); P(B, 6, 10, 2, 2); P(B, 10, 10, 2, 2);                       // body sitting up
    ell(g, 10, 4, 3, 3, B); P(B, 7, 0, 2, 2); P(B, 12, 0, 2, 2); P(H, 8, 1, 5, 1);                       // head and ears
    P(E, 8, 3); P(E, 12, 3); P(M, 9, 5, 3, 1); P(T, 10, 6);                                             // eyes, wrinkly muzzle, tongue
    P(B, 3, 7, 2, 2); P(H, 3, 7, 1, 1);
  } else {
    const up = f & 1;
    ell(g, 8, 7 + up, 5, 3, B); P(H, 5, 4 + up, 6, 1);                                                   // body
    if (up) { P(B, 5, 10, 2, 2); P(B, 10, 10, 2, 2); } else { P(B, 3, 9, 2, 3); P(B, 7, 10, 2, 2); P(B, 10, 9, 2, 3); P(B, 13, 10, 1, 2); }
    ell(g, 14, 5 + up, 3, 3, B); P(B, 11, 1 + up, 2, 2); P(B, 16, 1 + up, 2, 2); P(H, 12, 2 + up, 4, 1);
    P(E, 12, 4 + up); P(E, 15, 4 + up); P(M, 13, 6 + up, 4, 1); P(T, 15, 7 + up);
    P(B, 1, 5 + up, 2, 1); P(B, 1, 4 + up, 1, 1); P(H, 2, 4 + up, 1, 1);                               // curly tail
  }
  return personCache[k] = mdify(c);
}

const ICY = new Map();
function icySprite(spr) {
  if (ICY.has(spr)) return ICY.get(spr);

  g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(160,220,255,0.55)'; g.fillRect(0, 0, spr.width, spr.height);

  ICY.set(spr, c); return c;

// ===== the polar bear outside the Ice Cave (side view, head to the left) =====
function bearSprite(hd, blink, roar) {
  const [c, g] = mk(32, 30), O = '#3a4250', W = '#f6f4ec', L = '#dcdad0', S = '#aeb3bd';
  g.translate(1, 0);
  ell(g, 15, 25, 15, 3, 'rgba(0,10,40,0.3)');                              // shadow on the floor
  const leg = (x, y, h, w, col) => { g.fillStyle = O; g.fillRect(x - 1, y, w + 2, h + 1); g.fillRect(x - 2, y + h - 2, w + 3, 3); g.fillStyle = col; g.fillRect(x, y, w, h); g.fillRect(x - 1, y + h - 2, w + 1, 2); g.fillStyle = col === W ? L : '#959aa6'; g.fillRect(x - 1, y + h - 1, w + 1, 1); };
  leg(15, 15, 9, 3, S); leg(27, 14, 10, 3, S);                             // far legs
  // outline pass, then the white fur: rump, body, shoulder hump, neck, head, snout, ear
  const parts = [[23, 11, 6, 6], [18, 12, 9, 6], [12, 11, 5, 5], [8, 13, 4, 3], [5, 14 + hd, 4, 3], [1, 15 + hd, 2, 2], [6, 10 + hd, 1, 1]];
  for (const [x, y, rx, ry] of parts) ell(g, x, y, rx + 1, ry + 1, O);
  for (const [x, y, rx, ry] of parts) ell(g, x, y, rx, ry, W);
  ell(g, 19, 16, 8, 2, L); ell(g, 5, 16 + hd, 3, 1, L);                    // soft shading underneath
  g.fillStyle = O; g.fillRect(29, 9, 2, 2);                                // stubby tail
  leg(9, 15, 9, 4, W); leg(22, 15, 9, 4, W);                               // near legs with big paws
  g.fillStyle = '#111';
  if (blink) g.fillRect(3, 13 + hd, 2, 1); else { g.fillRect(3, 12 + hd, 2, 2); g.fillStyle = '#fff'; g.fillRect(3, 12 + hd, 1, 1); }
  g.fillStyle = '#111'; g.fillRect(-1, 14 + hd, 2, 2);                     // nose
  if (roar) { g.fillStyle = '#702'; g.fillRect(0, 17 + hd, 5, 3); g.fillStyle = '#e66'; g.fillRect(1, 18 + hd, 3, 1); g.fillStyle = '#fff'; g.fillRect(0, 17 + hd, 1, 1); g.fillRect(4, 17 + hd, 1, 1); }
  else { g.fillStyle = O; g.fillRect(1, 17 + hd, 3, 1); }
  return c;
}

// ----- movement -----
function moveV(v, dt) {
  const D = v.dest; if (!D) return;
  let ti = D.i, tj = D.j, lift = false;
  if (v.f !== D.f) {
    if (v.f === -1) { ti = M1_STAIRS[0]; tj = M1_STAIRS[1]; lift = 'up'; }                 // floor -1 has no lift: up the stairs to the Oceanarium
    else if (D.f === -1 && v.f === 1) { ti = SHOW_DOOR_STAND[0]; tj = SHOW_DOOR_STAND[1]; lift = 'down'; }
    else { const s = ELEV[v.f].s; ti = s[0]; tj = s[1]; lift = true; }
  }
  const d = flow(v.f, ti, tj);
  let budget = v.spd * dt, guard = 0;
  while (budget > 0 && guard++ < 8) {
    if (!v.wp) {
      const ci = v.x | 0, cj = v.y | 0, cur = d[cj * W + ci];
      if (cur === 0) { arrived(v, lift); return; }
      if (cur < 0 && !WALK[v.f][cj * W + ci]) {          // standing somewhere off the grid (like a seat by the wall): step to the nearest walkable spot
        let best = null, bd = 1e9;
        for (const [di, dj] of D8) { const ni = ci + di, nj = cj + dj; if (ni < 0 || nj < 0 || ni >= W || nj >= H) continue; const n = nj * W + ni; if (WALK[v.f][n] && d[n] >= 0 && d[n] < bd) { bd = d[n]; best = [ni + 0.5, nj + 0.5]; } }
        if (best) { v.wp = best; continue; }
      }
      if (cur < 0) { v.x = ti + 0.5; v.y = tj + 0.5; G.snaps++; continue; }
      let best = null, bd = 1e9;
      for (const [di, dj] of D8) {
        const ni = ci + di, nj = cj + dj; if (ni < 0 || nj < 0 || ni >= W || nj >= H) continue;
        const n = nj * W + ni; if (!WALK[v.f][n] || d[n] < 0) continue;
        if (di && dj && (!WALK[v.f][cj * W + ni] || !WALK[v.f][nj * W + ci])) continue;
        if (!canStep(v.f, ci, cj, di, dj)) continue;
        const sc = d[n] + (di && dj ? -0.4 : 0);
        if (sc < bd) { bd = sc; best = [ni + 0.5, nj + 0.5]; }
      }
      if (!best || bd >= cur) { v.x = ti + 0.5; v.y = tj + 0.5; G.snaps++; continue; }
      v.wp = best;
    }
    const dx = v.wp[0] - v.x, dy = v.wp[1] - v.y, dist = Math.hypot(dx, dy);
    if (dist <= budget) { v.x = v.wp[0]; v.y = v.wp[1]; budget -= dist; v.anim += dist * 1.6; v.wp = null; }
    else { v.x += dx / dist * budget; v.y += dy / dist * budget; v.anim += budget * 1.6; budget = 0; }
  }
}
const liftTo = f => f === -1 ? 1 : f;   // to get to -1 you ride to floor 1 and take the stairs
function arrived(v, lift) {
  if (lift === 'up') { v.f = 1; v.x = SHOW_DOOR_STAND[0] + 0.5; v.y = SHOW_DOOR_STAND[1] + 0.5; v.wp = null; return; }
  if (lift === 'down') { v.f = -1; v.x = M1_STAIRS[0] + 0.5; v.y = M1_STAIRS[1] + 0.5; v.wp = null; return; }
  if (lift) {
    v.rideRet = v.mode; v.mode = 'ride'; v.hidden = true; v.wp = null;
    v.rideEnd = G.t + rr(0.8, 1.5) * (1 + Math.abs(FLOORS.indexOf(v.f) - FLOORS.indexOf(liftTo(v.dest.f))) * 0.3);
    G.lift = (G.lift || 0) + 1; return;
  }

  if (cb) cb();
}

// ===== ROTATING RESTAURANT =====
const SPIN = [
  { n: 'SLOW', per: 60, pay: 0.9, fun: 5, sick: 0.003 },
  { n: 'NORMAL', per: 30, pay: 1, fun: 9, sick: 0.009 },
  { n: 'FAST', per: 10, pay: 1.3, fun: 14, sick: 0.045 }

const PUKE_LINES = ['BLEURGH! SOMEONE WAS SICK ON FLOOR 5', 'TOO MUCH SPINNING! SICK ON FLOOR 5', 'A GUEST LOST THEIR LUNCH ON FLOOR 5', 'CLEAN-UP NEEDED IN THE RESTAURANT!'];
function ringSpeed() { return Math.PI * 2 / SPIN[G.spin].per; }      // radians per game minute
function ringW(lx, ly) { const c = Math.cos(G.ringA), s = Math.sin(G.ringA); return [RC.x + lx * c - ly * s, RC.y + lx * s + ly * c]; }

function angDiff(a, b) { return Math.abs(((a - b) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI); }

  const dx = tl[0] - a.lx, dy = tl[1] - a.ly, d = Math.hypot(dx, dy), st = spd * dt;
  if (d <= st) { a.lx = tl[0]; a.ly = tl[1]; a.anim += d * 1.6; return true; }
  a.lx += dx / d * st; a.ly += dy / d * st; a.anim += st * 1.6; return false;
}
function stepOn(a) { a.onRing = true; [a.lx, a.ly] = toLocal(a.x, a.y); a.dest = null; a.wp = null; }
function stepOff(a) {
  a.onRing = false; [a.x, a.y] = ringW(a.lx, a.ly);

function startDine(v) {
  if (!G.P.chef) { v.mood -= 4; G.closedMiss.rest = (G.closedMiss.rest || 0) + 1; nextStep(v); return; }   // no chef, no food
  const free = SEATS.filter(s => !s.occ && !s.dirty);
  if (!free.length) { v.mood -= 4; nextStep(v); return; }
  const s = pick(free); s.occ = v; v.seat = s;
  goTo(v, 5, ELEV[5].s[0], ELEV[5].s[1], () => {
    const b = boardCell(s.a0, ringSpeed() * 1.5);

function leaveSeat(v) { if (v.seat) v.seat.occ = null; v.seat = null; v.mode = 'offring'; v.exitTo = exitLocal(v); }
function ringVisitor(v, dt) {
  if (v.mode === 'toseat') {
    if (ringWalk(v, seatLocal(v.seat), dt, v.spd)) {
      const waiting = G.V.filter(o => o.mode === 'dining' && G.t < o.foodAt).length;
      v.mode = 'dining'; v.foodAt = G.t + 2 + waiting / Math.max(1, working('chef')) * 1.1 * tiredSlow('chef'); v.until = v.foodAt + rr(6, 10); G.dined++;
      const pay = Math.round(rr(35, 70) * SPIN[G.spin].pay * priceMult('rest'));
      G.money += pay; G.revenue += pay; [v.x, v.y] = ringW(v.lx, v.ly); floatText(5, v.x, v.y, '+' + pay, K.yellow); sfx('coin');

    if (near) v.mood -= 2 * dt;
    if (G.t < v.foodAt && G.t - (v.foodAt - 2) > 4) v.mood -= 1.5 * dt;          // waiting too long for food
    if (!v.puked && rnd() < SPIN[G.spin].sick * (near ? 2 : 1) * dt) puke(v);
    else if (G.t >= v.until) { const fr = G.shop.rest.fresh; v.mood += SPIN[G.spin].fun + (fr >= 45 ? 3 : fr >= 20 ? 0 : -5); leaveSeat(v); }
  } else if (v.mode === 'offring') {

// ----- litter and the cleaning crew (Theme Park's handymen) -----
function dropLitter(v, kind) {
  if (v.hidden || v.onRing || v.f === -1 || v.inTour || v.mode === 'ride' || G.litter.length > 120) return;   // cleaners can't get to -1
  const x = v.x + rr(-0.25, 0.25), y = v.y + rr(-0.25, 0.25);
  if (!WALK[v.f][(y | 0) * W + (x | 0)]) return;

}
function messUpdate(dt) {
  G.messT = (G.messT || 0) + dt; if (G.messT < 0.5) return;
  const step = G.messT; G.messT = 0;
  for (const L of G.litter) for (const v of G.V) if (v.f === L.f && !v.hidden && Math.abs(v.x - L.x) < 1.1 && Math.abs(v.y - L.y) < 1.1) { v.mood -= 0.25 * step; if (G.t - L.t0 > 2 && rnd() < 0.06) think(v, 'dirty', 1.5); }
  const mess = G.litter.length + G.puddles.length;
  if (mess > 12) for (const v of G.V) if (!v.hidden) v.mood -= 0.012 * (mess - 12) * step;
}
function syncCleaners() {
  while (G.cleaners.length < G.P.clean) {
    const e = ENTRY[G.cleaners.length % ENTRY.length];
    G.cleaners.push({ id: G.cid++, f: 1, x: e[0] + 0.5, y: e[1] - 0.5, spd: 2.8, anim: 0, mode: 'idle', dest: null, wp: null, cb: null, job: null, onRing: false, hidden: false, jobT: 0 });
  }
  while (G.cleaners.length > G.P.clean) {
    const idx = G.cleaners.findIndex(c => c.mode === 'idle'), k = idx >= 0 ? idx : G.cleaners.length - 1;
    const c = G.cleaners.splice(k, 1)[0]; if (c.job) c.job.claimed = null; if (c.mode === 'ride') G.lift = Math.max(0, G.lift - 1);
  }
}
function messPos(m) { return m.lx != null ? ringW(m.lx, m.ly) : [m.x, m.y]; }
function jobScore(c, m) {
  const fm = m.lx != null ? 5 : m.f, [x, y] = messPos(m);
  return (m.prio ? 0 : 200) + (m.lx != null ? 0 : 20) + Math.abs(ALLFLOORS.indexOf(fm) - ALLFLOORS.indexOf(c.f)) * 25 + (fm === c.f ? Math.hypot(x - c.x, y - c.y) : 10);
}
function pickJob(c) {

  for (const m of G.litter) if (!m.claimed && (m.prio || G.t - m.t0 > 1)) { const s = jobScore(c, m); if (s < bs) { bs = s; best = m; } }   // it takes a couple of minutes to spot fresh litter
  for (const F of [4, -1]) { const L = G.loos[F]; if (L.dirt >= 25 && !L.job.claimed) { L.job.prio = L.dirt > 50; const s = jobScore(c, L.job) - 30; if (s < bs) { bs = s; best = L.job; } } }

    const b = boardCell(Math.atan2(m.ly, m.lx), ringSpeed() * 1.2);
    goTo(c, 5, b.i, b.j, () => { stepOn(c); c.mode = 'topuddle'; });

}

        const busy = FLOORS.map(f => G.V.filter(v => v.f === f).length + 3), tot = busy.reduce((a, b) => a + b, 0);

const P_TDOOR = [pol(305, 4.0), pol(270, 4.0), pol(SAT_DEG, 4.0), pol(SAT_DEG, 5.7), pol(SAT_DEG, 6.6), pol(SAT_DEG, 7.1)];   // -1: round the pool to Geldingadalir

  const h = nameHash(q.n);

// ----- the tech check: every two hours someone walks round with the iPad and checks everything -----
const CHECK_TIMES = [60, 180, 300, 420, 540, 660];          // 10:00, 12:00, 14:00, 16:00, 18:00, 20:00
const CHECK_STOPS = [['myv', null], ['itv', 'itv'], ['smell', 'smell'], ['glacierA', 'sensor'], ['glacierB', null], ['fish', 'fish']];
function startCheck() {
  const p = pickHelper('info'), list = ['fish'];                                // the fish game is ALWAYS playing up
  if (rnd() < 0.75) { const others = shuffle(['sensor', 'smell'].concat(G.attr.sphere ? ['itv'] : [])); list.push(others[0]); if (rnd() < 0.25) list.push(others[1]); }
  G.check = { who: p, f: 1, x: 15.5, y: 20.5, spd: 2.3, anim: 0, mode: 'walk', dest: null, wp: null, cb: null, si: -1, todo: list, found: [] };
  msg(callName(p) + ' IS DOING THE ' + clockStr(G.t) + ' TECH CHECK', 0);
  nextCheckStop();
}
function nextCheckStop() {
  const C = G.check; C.si++;
  if (C.si >= CHECK_STOPS.length) { endCheck(); return; }
  if (CHECK_STOPS[C.si][0] === 'itv' && !G.attr.sphere) { nextCheckStop(); return; }   // nothing to check until Into the Volcano is built
  const T = TECH[CHECK_STOPS[C.si][0]];
  C.mode = 'walk'; goTo(C, T.sf != null ? T.sf : T.f, T.stand[0], T.stand[1], () => { C.mode = 'checking'; C.until = G.t + 0.7; });
}
function endCheck() {
  const C = G.check, n = C.found.length, names = C.found.map(k => ({ fish: 'FISH GAME', sensor: 'SENSOR', itv: 'INTO THE VOLCANO', smell: 'SMELL' })[k]);
  let line = n ? 'TECH CHECK DONE. TO FIX: ' + names.join(', ') : 'TECH CHECK DONE: ALL GOOD!';
  if (tw(line) > 312) line = 'TECH CHECK DONE: ' + n + ' THINGS TO FIX. SEE THE RED !';
  msg(line, n ? 2 : 1);
  {
    explain('check', { who: 'haukur', title: callName(C.who) + ' DID THE TECH CHECK', lines: () => ['THE FISH GAME IS PLAYING UP. AGAIN. CLICK', 'EACH RED ! TO SEND SOMEONE TO SORT IT.'] }, true);
  }
  G.check = null;
}
function checkTick(dt) {
  if (G.nextCheck == null) G.nextCheck = 0;
  if (!G.check && G.nextCheck < CHECK_TIMES.length && G.t >= CHECK_TIMES[G.nextCheck]) { G.nextCheck++; startCheck(); }
  const C = G.check; if (!C) return;
  if (C.mode === 'ride') {
    if (G.t >= C.rideEnd) { const tf = liftTo(C.dest.f), s = ELEV[tf].s; C.f = tf; C.x = s[0] + 0.5; C.y = s[1] + 0.5; C.hidden = false; C.mode = C.rideRet; C.wp = null; G.lift = Math.max(0, G.lift - 1); }
    return;
  }
  if (C.mode === 'walk' && C.dest) { moveV(C, dt); return; }
  if (C.mode === 'checking' && G.t >= C.until) {
    const k = CHECK_STOPS[C.si][1];
    if (k && C.todo.includes(k) && probRaise(k, true)) C.found.push(k);
    nextCheckStop();
  }
}

// ----- shop stock: the gift shop, ice cream bar and coffee bar sell out unless you order more -----
const STOCK = {
  gift: { n: 'GIFT SHOP', f: 4, unit: 9, who: 'helena' },
  ice: { n: 'ICE CREAM', f: 4, unit: 3, who: 'birkir' },
  cafe: { n: 'COFFEE BAR', f: 5, unit: 6, who: 'birkir' }
};
const STOCK_MAX = 400, STOCK_LOW = 60, FAST_MINS = 30;
function stockInit() {
  if (!G.stock) G.stock = { gift: STOCK_MAX, ice: STOCK_MAX, cafe: STOCK_MAX };
  for (const k in STOCK) if (G.stock[k] == null) G.stock[k] = STOCK_MAX;
  if (!G.orders) G.orders = [];
}
const onTheWay = k => (G.orders || []).filter(o => o.k === k).reduce((s, o) => s + o.n, 0);
const stockNeed = k => { const n = STOCK_MAX - G.stock[k] - onTheWay(k); return n >= 20 ? n : 0; };   // the supplier won't bring less than 20
const stockCost = (k, mult) => Math.round(stockNeed(k) * STOCK[k].unit * mult / 10) * 10;
function orderStock(k, mode) {
  const n = stockNeed(k); if (!n) return false;
  const full = stockCost(k, 1);
  if (G.money < (mode === 'cheap' ? stockCost(k, 0.75) : full)) { sfx('bad'); msg('NOT ENOUGH MONEY FOR THAT ORDER', 2); return false; }
  let mult = 1, at = G.t + FAST_MINS, line;
  if (mode === 'cheap') { mult = 0.75; at = null; line = 'ORDERED. IT COMES FIRST THING TOMORROW'; }
  else if (mode === 'haggle') {                       // Birkir tries his luck with the supplier
    const r = rnd();
    if (r < 0.5) { mult = 0.6; at = G.t + 60; line = 'BIRKIR GOT A DEAL! 40% OFF, HERE IN 1 HOUR'; }
    else if (r < 0.8) { mult = 1; at = G.t + 60; line = 'NO DEAL TODAY. FULL PRICE, HERE IN 1 HOUR'; }
    else { mult = 0.5; at = null; line = 'THE SUPPLIER IS IN A HUFF. HALF PRICE, TOMORROW'; }
  } else line = 'ORDERED. HERE IN ' + FAST_MINS + ' MINUTES';
  if (at != null && at > DAY_END) at = null;          // too late today: it comes in the morning
  const cost = stockCost(k, mult);
  G.money -= cost; G.costs += cost;
  G.orders.push({ k, n, at });
  msg(STOCK[k].n + ': ' + line, 1); sfx('coin');
  return true;
}
function deliver(o) {
  G.orders.splice(G.orders.indexOf(o), 1);
  G.stock[o.k] = Math.min(STOCK_MAX, G.stock[o.k] + o.n);
  msg('DELIVERY! THE ' + STOCK[o.k].n + ' IS STOCKED UP AGAIN', 1); sfx('fix');
}
function stockMorning() { stockInit(); for (const o of G.orders.slice()) deliver(o); }      // anything still on the way arrives overnight
const stockOrderAct = k => () => {
  const n = stockNeed(k); if (!n) return { label: 'STOCK IS ON THE WAY', dis: true };
  const c = stockCost(k, 1); return { label: 'ORDER FAST  KR ' + fmt(c), dis: G.money < c, go: () => { if (orderStock(k, 'fast')) closeAdv(); } };
};
function stockTick() {
  stockInit();
  for (const o of G.orders.slice()) if (o.at != null && G.t >= o.at) deliver(o);
  for (const k in STOCK) {
    const s = G.stock[k], S = STOCK[k];
    if (s <= STOCK_LOW && !onTheWay(k)) {
      explain('stock', { who: S.who, title: 'THE ' + S.n + ' IS RUNNING LOW!', lines: () => ['ORDER MORE STOCK IN BUY, ON THE STOCK TAB.', 'FAST COSTS MORE. CHEAP COMES TOMORROW.'], act: stockOrderAct(k) });
    }
    if (s <= 0 && !onTheWay(k)) advise('soldout' + k, { who: S.who, cool: 90, title: 'THE ' + S.n + ' HAS SOLD OUT!', lines: () => ['GUESTS WANT TO BUY THINGS BUT THE', 'SHELVES ARE EMPTY. ORDER MORE STOCK?'], act: stockOrderAct(k) });
  }
}
function openStock() { G.win = 'buy'; G.buyTab = 'stock'; }
// help bar lines for low stock. clicking one opens the stock tab
function stockHelp() {
  const out = [];
  for (const k in STOCK) {
    const s = G.stock ? G.stock[k] : STOCK_MAX; if (s > STOCK_LOW || onTheWay(k)) continue;
    out.push({ f: STOCK[k].f, go: openStock, d: s <= 0 ? STOCK[k].n + ' SOLD OUT! CLICK TO ORDER STOCK' : STOCK[k].n + ' STOCK IS LOW. CLICK TO ORDER' });

// ----- school trips: a coach full of kids. after a while the sugar kicks in and they go nuts -----
const NUTS_ZONES = { 1: 'lwom', 2: 'gah', 4: 'hsd', '-1': 'a' };
function schoolNuts(e) {
  const ok = v => v.school && v.kid && !v.hidden && !v.gone && !v.inTour && !v.route && !v.onRing && v.f !== 5 && (v.mode === 'walk' || v.mode === 'linger') && NUTS_ZONES[v.f];
  const byF = {}; for (const v of G.V) if (ok(v)) (byF[v.f] = byF[v.f] || []).push(v);
  let f = null; for (const k in byF) if (!f || byF[k].length > byF[f].length) f = k;
  if (!f || byF[f].length < 3 || G.t > DAY_END - 40) {            // not enough of them about yet: try again in a bit
    e.tries = (e.tries || 0) + 1; if (e.tries > 10 || G.t > DAY_END - 40) e.done = true; else e.t = G.t + 8; return;
  }
  e.done = true; f = +f;
  const kids = byF[f].slice(0, 10);
  for (const v of kids) { v.nuts = true; v.nutsSpd = v.spd; v.spd = v.spd * 1.7; v.mode = 'nuts'; v.dest = null; v.wp = null; v.cb = null; v.browse = null; v.bubble = null; }
  const a = { kind: 'prob', prob: 'school', n: null, f, i: 0, j: 0, t0: G.t, life: 1e9 };
  nutsCentre(a); G.alerts.push(a);
  msg(PROBS.school.bar(a), 2); sfx('alert');
  explain('probschool', { who: 'alli', title: 'THE SCHOOL TRIP HAS GONE NUTS!', lines: () => ['TOO MUCH SUGAR! THEY ARE RUNNING RIOT.', 'CLICK THE RED ! TO SEND STAFF TO CALM THEM.'],
    act: () => ({ label: 'GO TO FLOOR ' + f, go: () => { G.floor = f; closeAdv(); } }) });
}
function nutsCentre(a) {
  let n = 0, x = 0, y = 0; for (const v of G.V) if (v.nuts) { n++; x += v.x; y += v.y; }
  if (n) { a.i = x / n - 0.5; a.j = y / n - 0.5; }
  return n;
}
function nutsUpdate(v, dt) {             // run about, knock over bins, bang on the fish tanks
  if (!v.dest) {
    const zs = NUTS_ZONES[v.f], cells = [];
    for (const z of zs) for (const c of (ZT[v.f][z] || [])) if (Math.abs(c[0] + 0.5 - v.x) + Math.abs(c[1] + 0.5 - v.y) < 6) cells.push(c);
    const t = cells.length ? pick(cells) : [v.x | 0, v.y | 0];
    goTo(v, v.f, t[0], t[1], null);
  }
  v.mood += 0.3 * dt;
  if (rnd() < 0.1 * dt) dropLitter(v);
  if (rnd() < 0.04 * dt && v.f === G.floor) {
    const z = MAPS[v.f][v.y | 0] && MAPS[v.f][v.y | 0][v.x | 0];
    floatText(v.f, v.x, v.y, z === 'o' ? 'BANG BANG!' : pick(['WHEEE!', 'TAG!', 'AAARGH!', 'SUGAR!', 'RACE YOU!']), '#e8e');
  }
}
function calmKids(a, teacher) {
  let said = 0;
  for (const v of G.V) if (v.nuts) {
    v.nuts = false; v.spd = v.nutsSpd || v.spd; v.mode = 'walk'; v.dest = null; v.wp = null; v.cb = null;
    if (said++ < 3 && v.f === G.floor) floatText(v.f, v.x, v.y, 'SORRY!', '#8ce');
    if (!v.hidden && !v.gone) startStep(v);
  }
  if (teacher) { G.alerts.splice(G.alerts.indexOf(a), 1); msg('THE TEACHER FINALLY CALMED THEM DOWN. PHEW!', 1); }
}
function schoolTick(dt) {
  const a = G.alerts.find(a => a.prob === 'school'); if (!a) return;
  if (!nutsCentre(a)) { G.alerts.splice(G.alerts.indexOf(a), 1); return; }
  if (!a.techAt && (G.t - a.t0 > 25 || G.t > DAY_END - 20)) { calmKids(a, true); return; }
  const kids = G.V.filter(v => v.nuts && !v.hidden);
  for (const v of G.V) {                                  // everyone near them gets fed up with the noise
    if (v.hidden || v.nuts || v.school || v.f !== a.f) continue;
    if (kids.some(k => Math.abs(k.x - v.x) + Math.abs(k.y - v.y) < 2.5)) v.mood -= 0.15 * dt;
  }

  HI.tried = true;

      HI.shared = s.docs.map(d => { const v = d.data() || {}; return { id: d.id, ini: cleanIni(v.ini), s: cleanNum(v.best), day: cleanNum(v.day) }; }).filter(r => r.s > 0);
      const me = HI.shared.find(r => r.id === uid); if (me && (!HI.mine || me.s > HI.mine.s)) HI.mine = me;

  if (st % 4 === 0) tone(NOTE(ch[0] - 12), 0.4, 'triangle', 0.05);
  tone(NOTE(ch[LEAD[st]] + 12 + ((s >> 5) % 2 ? 12 : 0)), 0.14, 'square', 0.011);
  if (st === 0 && bar % 2 === 1) tone(NOTE(ch[2] + 24), 0.3, 'square', 0.01);
}
function toggleMusic() {
  startAudio(); AU.music = !AU.music;
  if (AU.music && !AU.timer) AU.timer = setInterval(musicTick, 170);
  if (!AU.music && AU.timer) { clearInterval(AU.timer); AU.timer = null; }
}

// ===== INPUT =====
function cpos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * SW / r.width, y: (e.clientY - r.top) * SH / r.height }; }
cv.addEventListener('pointermove', e => {
  const p = cpos(e); IN.x = p.x; IN.y = p.y;
  const D = ZM.drag; if (D && ZM.to > 1) {                      // dragging the floor round while zoomed in
    const dx = (p.x - D.x) * 2, dy = (p.y - D.y) * 2;
    if (!ZM.dragged && Math.hypot(dx, dy) > 8) ZM.dragged = true;
    if (ZM.dragged) { ZM.vx = D.vx - dx / ZM.now; ZM.vy = D.vy - dy / ZM.now; clampView(); }
  }
});
cv.addEventListener('pointerleave', () => { IN.x = -1; IN.y = -1; });
const onWorld = p => G.state === 'play' && p.y > 26 && p.y < 176;
cv.addEventListener('pointerdown', e => {
  const p = cpos(e); IN.x = p.x; IN.y = p.y; startAudio(); e.preventDefault();
  if (ZM.to > 1 && onWorld(p)) { ZM.drag = { x: p.x, y: p.y, vx: ZM.vx, vy: ZM.vy }; ZM.dragged = false; try { cv.setPointerCapture(e.pointerId); } catch (er) { } }   // wait: is it a click or a drag?
  else IN.click = p;
});
cv.addEventListener('pointerup', e => { const D = ZM.drag; ZM.drag = null; if (D && !ZM.dragged) IN.click = { x: D.x, y: D.y }; ZM.dragged = false; });
cv.addEventListener('wheel', e => { e.preventDefault(); if (G.state !== 'play') return; const p = cpos(e); if (e.deltaY < 0) zoomAt(ZOOM_IN, p.x * 2, p.y * 2); else if (e.deltaY > 0) zoomAt(1); }, { passive: false });
addEventListener('keydown', e => {
  const k = e.key; KEYS[k] = true;
  if (G.state === 'end' && hiKey(k)) { e.preventDefault(); return; }
  if (k === 'f' || k === 'F') { toggleFull(); return; }
  if ((k === 'z' || k === 'Z') && G.state === 'play') { zoomAt(ZM.to > 1 ? 1 : ZOOM_IN, IN.x >= 0 && onWorld(IN) ? IN.x * 2 : null, IN.x >= 0 && onWorld(IN) ? IN.y * 2 : null); return; }
  if (k.startsWith('Arrow') && ZM.to > 1) e.preventDefault();
  if (G.state === 'title' && (k === 'Enter' || k === ' ')) { G.saved = loadGame(); G.state = 'how'; G.win = 'how'; startAudio(); e.preventDefault(); return; }
  konamiKey(k);
  if (G.state === 'how' && (k === 'Enter' || k === ' ')) { if (G.saved) { newCampaign(G.saved); G.win = null; tutOffer(); } else G.win = 'pick'; e.preventDefault(); return; }
  if (G.state !== 'play') return;
  if (k === '1' || k === '2') G.floor = +k;
  else if (k === '0') G.floor = -1;
  else if (k === '4') G.floor = 4; else if (k === '5') G.floor = 5;
  else if (k === ' ') { if (G.adv) closeAdv(); else if (G.speed === 0) G.speed = G.prevSpeed || 2; else { G.prevSpeed = G.speed; G.speed = 0; } e.preventDefault(); }
  else if (k === 'Escape') { if (G.adv) closeAdv(); else { if (G.win === 'tutask') G.speed = 1; G.win = null; } }
  else if (k === 'm' || k === 'M') toggleMusic();
  else if (k === 'h' || k === 'H' || k === '?') G.win = G.win === 'guide' ? null : 'guide';
  else if (k === 'l' || k === 'L') G.labels = !G.labels;
  else if (k === '+' || k === '=') G.speed = Math.min(3, G.speed + 1);
  else if (k === '-') G.speed = Math.max(1, G.speed - 1);
});

// ===== MAIN LOOP =====
NO_SAVE = true; newCampaign(null); NO_SAVE = false; G.state = 'title';
let lastT = performance.now();
function frame(now) {
  const dtReal = Math.min(0.1, (now - lastT) / 1000); lastT = now; TNOW += dtReal; zoomFrame(dtReal);
  IN.hover = false; IN.winRect = null;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.state === 'title') { ctx.drawImage(BG, 0, 0); drawTitleScene(); ctx.setTransform(2, 0, 0, 2, 0, 0); drawTitle(); }
  else {
    if (G.state === 'play' && !G.over) {
      let adv = SPEEDS[G.speed] * dtReal;
      while (adv > 0) { const s = Math.min(adv, 0.1); simStep(s); adv -= s; }
    }
    drawWorld();
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    if (G.staffDraft && G.win !== 'staff') commitStaff();          // you closed the staff menu: now the changes happen
    drawHUD(); drawBottom();
    if (G.floor === 5 && G.state === 'play' && !G.win) drawRingCtl();
    if (G.state === 'play' && !G.win && !G.adv && G.advQ.length) { G.adv = G.advQ.shift(); if (G.speed) { G.advPrev = G.speed; G.speed = 0; } sfx('alert'); }
    if (G.win === 'pick' && G.state === 'how') winPick();
    else if (G.win === 'hiscores' && (G.state === 'how' || G.state === 'play')) winHiTable(null);
    else if (G.state === 'how') winHow();
    else if (G.state === 'end') { if (G.hiStage === 'typing') winHiEnter(); else if (G.hiStage === 'table') winHiTable(endContinue); else winEnd(); }
    else if (G.state === 'awards') winAwards();
    else if (G.win === 'tutask' && G.state === 'play') winTutAsk();
    else if (G.win === 'prop') winProp();
    else if (G.win === 'kid') winKid();
    else if (G.win === 'goals') winGoals();
    else if (G.win === 'guide') winGuide();
    else if (G.win === 'staff') winStaff();
    else if (G.win === 'shows') winShows();
    else if (G.win === 'buy') winBuy();
    else if (G.adv && G.state === 'play') drawAdvisor();
    if (G.state === 'play' && G.tut) { tutTick(); drawTutorial(); }
    if (IN.click && !IN.consumed) {
      const wr = IN.winRect, c = IN.click;
      if (wr && inside(c.x, c.y, wr.x, wr.y, wr.w, wr.h)) IN.consumed = true;
      else if (G.state === 'play' && c.y > 26 && c.y < 176) {
        for (let i = G.hot.length - 1; i >= 0; i--) {
          const h = G.hot[i];
          const wb = toBase(c.x * 2, c.y * 2);
          if (inside(wb[0] - G.cam[0], wb[1] - G.cam[1], h.x, h.y, h.w, h.h)) { if (h.v) guestClick(h.v); else if (h.whale) catchWhale(); else if (h.bear) bearRoar(); else if (h.honk) busHonk(); else if (h.myv) myvClick(); else if (h.ocs) oceanClick(); else if (h.egg) eggClick(h.egg); else if (h.supw) supClick(); else if (h.staffP) staffClick(h.staffP); else if (h.chk) msg(G.check ? G.check.who.name + ' IS DOING THE TECH CHECK WITH THE IPAD' : 'TECH CHECK', 1); else if (h.a) alertClick(h.a); else if (h.p) sendCleaner(h.p); else if (h.l) sendCleaner(h.l); else if (h.crew) crewClick(h.crew); IN.consumed = true; break; }
        }
      }
    }
    if (!IN.hover && G.hot && !IN.winRect && IN.y > 26 && IN.y < 176) { const hb = toBase(IN.x * 2, IN.y * 2); for (const h of G.hot) if (inside(hb[0] - (G.cam ? G.cam[0] : 0), hb[1] - (G.cam ? G.cam[1] : 0), h.x, h.y, h.w, h.h)) IN.hover = true; }
  }
  cv.style.cursor = IN.hover ? 'pointer' : 'default';
  IN.click = null; IN.consumed = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
